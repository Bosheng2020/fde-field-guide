name: Content quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bilingual-pairs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check bilingual file pairs
        run: bash scripts/check-bilingual.sh
      - name: Check local Markdown links
        run: node scripts/check-markdown-links.mjs

